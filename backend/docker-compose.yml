#
# Docker status:
# - Docker remains allowed as a future option for local/dev infrastructure.
# - The previous Kovir ERP Docker/deploy setup was discarded with the AWS/deploy
#   cleanup and must not be treated as an active or validated baseline.
# - If a new Docker setup is needed, design and validate it from scratch.
# - This compose file is not an official full Kovir ERP stack; at most, treat it
#   as a local PostgreSQL helper after fresh review of credentials and volumes.
#

services:
  postgres:
    image: postgres:16-alpine
    container_name: kovir-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB obrigatorio}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER obrigatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatorio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kovir_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kovir_postgres_data:
